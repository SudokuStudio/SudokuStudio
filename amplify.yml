version: 1
frontend:
    phases:
        preBuild:
            commands:
                - npm i -g pnpm
                - pnpm i
        build:
            commands:
                - SUDOKU_STUDIO_VERSION="${AWS_COMMIT_ID:0:7}" pnpm run build
    artifacts:
        baseDirectory: /packages/web/build/
        files:
            - '**/*'
    cache:
        paths:
            - node_modules/**/*
